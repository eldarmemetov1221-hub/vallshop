services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # SQLite-файл храним в volume ./data (переживает пересборку).
      DATABASE_URL: sqlite+aiosqlite:////app/data/vallshop.db
    volumes:
      - ./data:/app/data
    # Порт наружу НЕ публикуем: для режима без домена он не нужен (оплата —
    # кнопкой в боте). Для вебхука поднимается Caddy (см. deploy/DEPLOY.md),
    # который ходит к боту по внутренней сети compose.

  # Вариант с PostgreSQL (при желании): раскомментируйте db и в .env задайте
  # DATABASE_URL=postgresql+asyncpg://vallshop:vallshop@db:5432/vallshop
  # db:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: vallshop
  #     POSTGRES_PASSWORD: vallshop
  #     POSTGRES_DB: vallshop
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data

# volumes:
#   pgdata:
